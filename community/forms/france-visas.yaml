sections:
  - title: 第一步：在 France-Visas 填申请表
    items:
      - 打开 France-Visas 官网，注册账号后在线填写申请表。
      - 提交后会得到 FV 开头的申请编号，截图保存，下一步预约要用。
      - 生成的申请表 PDF 要打印出来，递签当天带去。
    tips:
      - 认准官方域名，防假冒网站。
    evidence:
      - {source: g1, quote: "先在 France-Visas 填表获取 FV 编号：https://france-visas.gouv.fr/zh"}
      - {source: g2, quote: "官网填申请表 → 生成申请号（截图保存）"}
  - title: 第二步：在 TLScontact 预约递签
    items:
      - 打开 TLScontact 法国签证中心网站（visas-fr.tlscontact.com，原资料写的 .cn 会自动跳转过去），居住地选 China，注册账号。
      - 关联上一步拿到的申请编号，选择递签城市和时间。
      - 预约成功后下载预约确认单并打印。
    tips:
      - 法国不分领区，全国任意城市都能递签。
      - 暑期号源紧张时，号是分批放的，可以多刷几次；预约免费，不要找黄牛。
    evidence:
      - {source: g1, quote: "再到 TLScontact 预约递签：https://visas-fr.tlscontact.cn"}
      - {source: g2, quote: "注册签证中心 → 关联申请号 → 选城市预约"}
      - {source: g1, quote: "法国不分领区，全国任意城市可递"}

