sections:
  - title: 第一步：缴纳 SEVIS I-901 费（FMJFEE.com）
    items:
      - 打开 FMJFEE.com，点 Pay I-901 Fee，按 I-20 上的 SEVIS ID 填写。
      - F-1 学生费用 350 美元，可以用信用卡支付。
      - 缴完后在 Check I-901 Status 里打印缴费确认（收据），面签要带。
    tips:
      - 核对 SEVIS 上的信息和 I-20 是否一致。
    evidence:
      - {source: g1, quote: "缴纳 SEVIS I-901 费用 350 美金，信用卡支付，并打印收据。"}
      - {source: g1, quote: "核对 sevis 上的信息和 i20 是否一致"}
      - {source: g3, quote: "You will need proof of payment for your visa interview."}
  - title: 第二步：填写 DS-160（CEAC）
    items:
      - 打开 CEAC 官网在线填写，官网说大约需要 90 分钟。
      - 要上传照片电子版：51×51 mm 白底，240kb 以下，不可戴眼镜。
      - 教育背景、旅行计划等所有信息要和 I-20 完全一致。
      - 提交后生成以 AA 开头的确认码，保存好；打印确认页，黑白或彩打均可。
    tips:
      - 填写的社交媒体账号要提前设为公开；没写全的，面签时可以附一份社交媒体清单。
    evidence:
      - {source: g4, quote: "It takes approximately 90 minutes to do this."}
      - {source: g1, quote: "51 x 51 mm，洗一张，并保留电子版（需要上传到 DS160），要求在 240kb 以下，不可戴眼镜。"}
      - {source: g2, quote: "填写时务必保证所有信息（如教育背景、旅行计划）与I-20完全一致"}
      - {source: g2, quote: "提交后会生成一个AA开头的确认码，记得保存好"}
      - {source: g2, quote: "务必在DS-160表格中填写的账号提前设置为公开状态。"}
  - title: 第三步：付签证费并预约面谈（USTravelDocs）
    items:
      - 拿到 DS-160 的 AA 码后，到美国签证信息服务中国网站付签证申请费并预约面谈。
      - F 类签证申请费 185 美元，可以用支付宝支付。
      - 预约成功后打印预约单，黑白或彩打均可。
    tips:
      - 5–8 月是申请高峰，名额紧张，尽早预约。
      - 可重新预约的次数有限，定时间前想好。
      - 原帖给的旧预约网址（cgifederal.secure.force.com）已无法访问，以官网现在的入口为准。
    evidence:
      - {source: g2, quote: "拿到DS-160的AA码后，就可以去美国签证申请服务官网预约面签时间了。"}
      - {source: g1, quote: "预约系统中需要支付 185 美金，支付宝即可支付。"}
      - {source: g5, quote: "$185B 商务/旅行C-1 过境D 船员/机组人员F 学生（学术性）"}
      - {source: g6, quote: "申请人允许重新预约的次数有限。"}

