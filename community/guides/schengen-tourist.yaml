# 申根短期旅游签流程攻略。
# 整理自 https://github.com/EndlessBlueWJL/schengen-visa-guide 的 references/checklist.md（commit 780b004），
# 原项目为 MIT License，Copyright (c) 2025 EndlessBlueWJL；evidence 只摘录不超过 60 字的原话。
# 整理过程和发现的问题见 specs/002-guide-to-track/trials/README.md（试验 #1）。

id: schengen-tourist
title: 申根短期旅游签证（中国大陆护照）
category: 签证
summary: 持中国大陆护照、按身份（学生/在职/退休/自由职业/无业）准备申根 C 类旅游签的材料和步骤
maintainers: []
updated: 2026-09-23
timeline: 递签后通常 15 天左右出签，最长约 45 天；建议出行前至少提前 1–1.5 个月递签。

sources:
  - id: g1
    title: schengen-visa-guide · 申根签证材料清单
    url: https://github.com/EndlessBlueWJL/schengen-visa-guide/blob/main/references/checklist.md
    as_of: 2025-07-01

phases:
  - id: p-online
    title: 官网填表并预约
    mode: online
    summary: 在申请国签证官网填写申请表，再到签证中心网站（TLScontact / VFS / BLS）预约递签时间。两份确认单都要打印带去。
    evidence: [{source: g1, quote: "选申请国 → 网上预约 → 准备证件"}]
  - id: p-materials
    title: 准备材料
    summary: 证件复印、身份证明、保险、流水、行程单和机酒预订单，最后写解释信。按身份不同，要准备的东西不一样。
    evidence: [{source: g1, quote: "证件类（1-5） — 复印拍照，基础活"}]
  - id: p-submit
    title: 线下递签
    mode: offline
    summary: 本人带齐材料去签证中心递交，首次申请要现场录十指指纹。
    evidence: [{source: g1, quote: "写解释信 → 递签（现场录指纹）→ 等出签"}]
  - id: p-wait
    title: 等出签
    duration_days: {typical: 15, max: 45}
    evidence: [{source: g1, quote: "递签后通常 15 天左右出签，最长可能 45 天"}, {source: g1, quote: "建议出行前至少提前 1-1.5 个月递签"}]

facts:
  identity:
    question: 你目前的身份是？
    options: [在校学生, 在职, 退休, 自由职业, 无业]
  minor:
    question: 申请人是否未满 18 岁？
    options: [是, 否]
  married:
    question: 是否已婚？
    options: [是, 否]
  sponsored:
    question: 这次旅行是否由父母/配偶或其他人出资？
    options: [是, 否]
  sponsor_same_hukou:
    question: 出资人和你在同一本户口本上吗？
    options: [是, 否]
    ask_if: [{fact: sponsored, in: [是]}]

requirements:
  # ---- 证件类（所有身份）----
  - id: r-passport
    kind: obtain
    material_type: null
    raw_name: 护照原件 + 所有面复印件 ×2 份
    optional: false
    applies_if: []
    freshness_days: null
    note: 有效期需超过离开申根区日期至少 3 个月；至少 2 页空白签证页；签发不超过 10 年。不需复印空白页，原件递签当天带
    evidence: [{source: g1, quote: "有效期需超过离开申根区日期至少 3 个月，至少有 2 页空白签证页，且签发时间不超过 10 年"}]
  - id: r-old-passport
    kind: obtain
    material_type: old_passport_copy
    raw_name: 旧护照复印件
    optional: true
    applies_if: []
    freshness_days: null
    note: 复印个人信息页 + 签证页 + 出入境盖章页
    evidence: [{source: g1, quote: "如有旧护照，复印个人信息页 + 签证页 + 出入境盖章页。没有旧护照可跳过"}]
  - id: r-id-card
    kind: obtain
    material_type: null
    raw_name: 身份证原件 + 复印件
    optional: false
    applies_if: []
    freshness_days: null
    note: 正反面复印在同一面
    evidence: [{source: g1, quote: "正反面复印在同一面"}]
  - id: r-hukou
    kind: obtain
    material_type: null
    raw_name: 户口本整本复印件
    optional: false
    applies_if: []
    freshness_days: null
    note: 从封面到最后一页全部复印，不要只印自己那一页
    evidence: [{source: g1, quote: "从封面到最后一页全部复印，不要只印自己那一页"}]
  - id: r-photo
    kind: obtain
    material_type: null
    raw_name: 两寸白底证件照
    optional: false
    applies_if: []
    freshness_days: null
    note: 签证中心可现场拍；自带需为近期照片
    evidence: [{source: g1, quote: "签证中心现场拍 35 块也行，自己带的话要近期"}]

  # ---- 身份证明：在校学生 ----
  - id: r-enrollment
    kind: obtain
    material_type: null
    raw_name: 中英文在读证明
    optional: false
    applies_if: [{fact: identity, in: [在校学生]}]
    freshness_days: null
    note: 学校教务处开具，需老师签字 + 学校公章
    evidence: [{source: g1, quote: "学校教务处开具，需老师签字 + 学校公章"}]
  - id: r-student-card
    kind: obtain
    material_type: null
    raw_name: 学生证原件 + 复印件
    optional: false
    applies_if: [{fact: identity, in: [在校学生]}]
    freshness_days: null
    note: 原件递签当天带
    evidence: [{source: g1, quote: "学生证原件 + 复印件 | 原件递签当天带过去"}]
  - id: r-chsi
    kind: obtain
    material_type: null
    raw_name: 学信网中英文学籍证明
    optional: false
    applies_if: [{fact: identity, in: [在校学生]}]
    freshness_days: null
    note: 学信网在线申请，下载中英文版
    evidence: [{source: g1, quote: "学信网（www.chsi.com.cn）在线申请，下载中英文版"}]

  # ---- 身份证明：在职 ----
  - id: r-employment-letter
    kind: obtain
    material_type: employment_letter
    raw_name: 在职证明
    optional: false
    applies_if: [{fact: identity, in: [在职]}]
    freshness_days: null
    note: 公司抬头纸，含公司名称/地址/电话/传真，体现姓名、职务、薪资、入职年限、准假日期；法人或人事签字 + 公章
    evidence: [{source: g1, quote: "需公司法人或人事签字 + 公司公章"}]
  - id: r-business-license
    kind: obtain
    material_type: null
    raw_name: 营业执照副本复印件
    optional: false
    applies_if: [{fact: identity, in: [在职]}]
    freshness_days: null
    note: 加盖公司公章
    evidence: [{source: g1, quote: "营业执照副本复印件 | 加盖公司公章"}]
  - id: r-salary
    kind: obtain
    material_type: null
    raw_name: 近 6 个月工资流水
    optional: false
    applies_if: [{fact: identity, in: [在职]}]
    freshness_days: null
    note: 银行打印，体现每月固定收入
    evidence: [{source: g1, quote: "银行打印，体现每月固定收入"}]

  # ---- 身份证明：退休 ----
  - id: r-retirement-cert
    kind: obtain
    material_type: null
    raw_name: 退休证原件 + 复印件
    optional: false
    applies_if: [{fact: identity, in: [退休]}]
    freshness_days: null
    note: null
    evidence: [{source: g1, quote: "退休证原件 + 复印件"}]
  - id: r-pension
    kind: obtain
    material_type: pension_statement
    raw_name: 退休金流水
    optional: false
    applies_if: [{fact: identity, in: [退休]}]
    freshness_days: null
    note: 近 3-6 个月，体现每月退休金到账
    evidence: [{source: g1, quote: "近 3-6 个月，体现每月退休金到账"}]

  # ---- 身份证明：自由职业 / 无业 ----
  - id: r-income-explanation
    kind: generate
    material_type: null
    raw_name: 收入来源说明
    optional: false
    applies_if: [{fact: identity, in: [自由职业, 无业]}]
    freshness_days: null
    note: 写在解释信里，附相关证明（稿费、投资收益、freelance 合同等）；无业需额外强调回国约束力
    evidence: [{source: g1, quote: "解释信里详细说明收入来源（如稿费、投资收益、freelance 合同等），附相关证明"}]

  # ---- 出资人（任何身份，有人出资时）----
  - id: r-sponsor-docs
    kind: obtain
    material_type: sponsor_documents
    raw_name: 出资人材料（出资人流水 + 出资人在职证明/身份证复印件）
    optional: false
    applies_if: [{fact: sponsored, in: [是]}]
    freshness_days: null
    note: 在职身份写的是"出资人流水 + 出资人在职证明"；自由职业/无业写的是"出资人银行流水 + 出资人身份证复印件"
    evidence: [{source: g1, quote: "父母/配偶出资：另需出资人流水 + 出资人在职证明"}]
  - id: r-kinship-notary
    kind: obtain
    material_type: null
    raw_name: 亲属关系公证 + 海牙认证
    optional: false
    applies_if: [{fact: sponsored, in: [是]}, {fact: sponsor_same_hukou, in: [否]}]
    freshness_days: null
    note: null
    evidence: [{source: g1, quote: "不在同一户口本还需亲属关系公证 + 海牙认证"}]

  # ---- 未成年人 ----
  - id: r-birth-cert
    kind: obtain
    material_type: null
    raw_name: 出生医学证明公证 + 海牙认证（Apostille）
    optional: false
    applies_if: [{fact: minor, in: [是]}]
    freshness_days: null
    note: 中国自 2023-11-07 起加入海牙公约，办「公证 + 海牙认证」即可，无需双认证
    evidence: [{source: g1, quote: "涉外公证书办「公证 + 海牙认证」即可，无需再办双认证"}]
  - id: r-parental-consent
    kind: obtain
    material_type: null
    raw_name: 父母双方同意出行委托书公证 + 海牙认证
    optional: false
    applies_if: [{fact: minor, in: [是]}]
    freshness_days: null
    note: 父母双方签字；一方不能到场需出具同意书；离异/单亲附相关法律文件
    evidence: [{source: g1, quote: "父母双方签字；若一方不能到场，需出具同意书"}]
  - id: r-parents-docs
    kind: obtain
    material_type: null
    raw_name: 父母身份及关系材料
    optional: false
    applies_if: [{fact: minor, in: [是]}]
    freshness_days: null
    note: 父母身份证/护照复印件、结婚证或亲属关系公证 + 海牙认证
    evidence: [{source: g1, quote: "父母双方身份证/护照复印件、父母结婚证或亲属关系公证 + 海牙认证"}]

  # ---- 旅行保障 / 资金 ----
  - id: r-insurance
    kind: obtain
    material_type: travel_insurance
    raw_name: 旅行保险
    optional: false
    applies_if: []
    freshness_days: null
    note: 保额至少 3 万欧元，覆盖整个申根区；彩色打印前两页；出签前别退
    evidence: [{source: g1, quote: "保额至少 3 万欧元，覆盖整个申根区。彩色打印前两页"}]
  - id: r-bank
    kind: obtain
    material_type: null
    raw_name: 最近 3-6 个月银行流水
    optional: false
    applies_if: []
    freshness_days: null
    note: 余额需覆盖整个行程；实操参考 ≤15 天 ¥2,000×天数，>15 天 ¥30,000+¥4,000×(天数−15)，非硬门槛；不要临时大额转账凑数
    evidence: [{source: g1, quote: "余额需覆盖整个行程，按下方预算测算公式估算"}]
  - id: r-property
    kind: obtain
    material_type: null
    raw_name: 房产证 / 车辆登记证复印件
    optional: true
    applies_if: []
    freshness_days: null
    note: 加分项，只交复印件不交原件
    evidence: [{source: g1, quote: "有的话提供，是加分项。只交复印件，不交原件。没有可跳过"}]

  # ---- 行程与机酒 ----
  - id: r-itinerary
    kind: generate
    material_type: itinerary
    raw_name: 行程单
    optional: false
    applies_if: []
    freshness_days: null
    note: 可用「行程助手」app 或让 AI 生成；一天 3-4 个景点，别太赶
    evidence: [{source: g1, quote: "可用「行程助手」app 或让 AI 直接生成。申请国天数写最长"}]
  - id: r-flight
    kind: obtain
    material_type: flight_reservation
    raw_name: 机票预订单
    optional: false
    applies_if: []
    freshness_days: null
    note: trip.com 预订，不付款即可打印；德国等部分领区有时要求已付款机票
    evidence: [{source: g1, quote: "trip.com（携程海外版）预订，不用付款就能打印"}]
  - id: r-hotel
    kind: obtain
    material_type: hotel_reservation
    raw_name: 酒店预订单
    optional: false
    applies_if: []
    freshness_days: null
    note: 携程 / Agoda / Booking 均可，选免费取消或先用后付
    evidence: [{source: g1, quote: "选\"免费取消\"或\"先用后付\"，下单后下载确认单"}]

  # ---- 已婚 / 解释信 / 预约凭证 ----
  - id: r-marriage
    kind: obtain
    material_type: null
    raw_name: 结婚证复印件 + 英文翻译件
    optional: false
    applies_if: [{fact: married, in: [是]}]
    freshness_days: null
    note: null
    evidence: [{source: g1, quote: "已婚者必须提供。未婚/离异跳过"}]
  - id: r-cover-letter
    kind: generate
    material_type: cover_letter
    raw_name: 解释信
    optional: false
    applies_if: []
    freshness_days: null
    note: 英文；讲清资金来源 + 回国约束力 + 旅行目的
    evidence: [{source: g1, quote: "需解释三件事：资金来源 + 回国约束力 + 旅行目的"}]
  - id: r-application-form
    kind: output
    material_type: visa_application_form
    raw_name: 签证申请表
    optional: false
    applies_if: []
    freshness_days: null
    note: 申请国签证官网填写后生成的 PDF，打印
    evidence: [{source: g1, quote: "在申请国签证官网上填写后生成的 PDF，打印出来"}]
  - id: r-appointment
    kind: output
    material_type: appointment_confirmation
    raw_name: 签证中心预约单
    optional: false
    applies_if: []
    freshness_days: null
    note: TLScontact / VFS / BLS 预约后生成，打印
    evidence: [{source: g1, quote: "在 TLScontact/VFS/BLS 预约后生成的确认单，打印出来"}]

steps:
  - id: s-choose-country
    title: 选定申请国
    phase: p-online
    where: 自己决定（行程里停留最久的国家）
    requirements: []
    depends_on: []
    applies_if: []
    estimate: null
    duration_days: null
    evidence: [{source: g1, quote: "选申请国 → 网上预约 → 准备证件"}]
  - id: s-appointment
    title: 网上填申请表并预约签证中心
    phase: p-online
    where: 申请国签证官网 + TLScontact / VFS / BLS
    requirements: [r-application-form, r-appointment]
    depends_on: [s-choose-country]
    applies_if: []
    estimate: null
    duration_days: null
    evidence: [{source: g1, quote: "打印之前填表和预约时生成的 PDF"}]
  - id: s-copy-ids
    title: 复印证件、拍证件照
    phase: p-materials
    where: 打印店 / 签证中心现场
    requirements: [r-passport, r-old-passport, r-id-card, r-hukou, r-photo, r-property]
    depends_on: []
    applies_if: []
    estimate: null
    duration_days: null
    evidence: [{source: g1, quote: "证件类（1-5） — 复印拍照，基础活"}]
  - id: s-student-docs
    title: 找教务处开在读证明、下载学信网学籍证明
    phase: p-materials
    where: 学校教务处 + 学信网
    requirements: [r-enrollment, r-student-card, r-chsi]
    depends_on: []
    applies_if: [{fact: identity, in: [在校学生]}]
    estimate: null
    duration_days: null
    evidence: [{source: g1, quote: "在职的找公司开证明，学生跑教务处"}]
  - id: s-employer-docs
    title: 找公司开在职证明、要营业执照复印件
    phase: p-materials
    where: 公司人事
    requirements: [r-employment-letter, r-business-license]
    depends_on: []
    applies_if: [{fact: identity, in: [在职]}]
    estimate: null
    duration_days: null
    evidence: [{source: g1, quote: "在职的找公司开证明，学生跑教务处"}]
  - id: s-retiree-docs
    title: 复印退休证
    phase: p-materials
    where: 打印店
    requirements: [r-retirement-cert]
    depends_on: []
    applies_if: [{fact: identity, in: [退休]}]
    estimate: null
    duration_days: null
    evidence: [{source: g1, quote: "退休证原件 + 复印件"}]
  - id: s-sponsor-docs
    title: 准备出资人材料（不在同一户口本还要办亲属关系公证）
    phase: p-materials
    where: 出资人所在银行 / 单位 + 公证处
    requirements: [r-sponsor-docs, r-kinship-notary]
    depends_on: []
    applies_if: [{fact: sponsored, in: [是]}]
    estimate: null
    duration_days: null
    evidence: [{source: g1, quote: "不在同一户口本还需亲属关系公证 + 海牙认证"}]
  - id: s-minor-docs
    title: 办未成年人公证材料（出生证明、出行同意书、父母关系）
    phase: p-materials
    where: 公证处
    requirements: [r-birth-cert, r-parental-consent, r-parents-docs]
    depends_on: []
    applies_if: [{fact: minor, in: [是]}]
    estimate: null
    duration_days: null
    evidence: [{source: g1, quote: "父母双方签字；若一方不能到场，需出具同意书"}]
  - id: s-insurance
    title: 买申根旅行保险
    phase: p-materials
    where: 京东 / 支付宝
    requirements: [r-insurance]
    depends_on: []
    applies_if: []
    estimate: 5 分钟
    duration_days: null
    evidence: [{source: g1, quote: "保险（9） — 京东/支付宝 5 分钟，日期覆盖行程"}]
  - id: s-bank
    title: 去银行打流水
    phase: p-materials
    where: 银行
    requirements: [r-bank, r-salary, r-pension]
    depends_on: []
    applies_if: []
    estimate: null
    duration_days: null
    evidence: [{source: g1, quote: "银行打流水，按预算公式确认余额够，记得别临时大额转账"}]
  - id: s-itinerary
    title: 做行程单
    phase: p-materials
    where: 「行程助手」app 或让 AI 生成
    requirements: [r-itinerary]
    depends_on: [s-choose-country]
    applies_if: []
    estimate: null
    duration_days: null
    evidence: [{source: g1, quote: "行程单（12） — 申请国天数最长，一天 3-4 景点，别特种兵"}]
  - id: s-flight
    title: 订机票预订单（不付款）
    phase: p-materials
    where: trip.com
    requirements: [r-flight]
    depends_on: [s-itinerary]
    applies_if: []
    estimate: null
