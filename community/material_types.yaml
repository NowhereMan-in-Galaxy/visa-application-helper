# 材料类型词表（specs/002-guide-to-track/spec.md "数据结构 §3"）。共享内容，不含任何个人信息。
#
# 作用：把攻略里五花八门的叫法对齐到同一个 key，匹配材料库靠它。
# 匹配规则：叫法和别名两边都先按 normalize 删掉修饰片段，再忽略大小写、去掉所有空白，完全相等才算命中。不做模糊匹配。
# 约束：key 全局唯一；两个不同 key 的别名规范化之后不能相同（加载时会报错）。
# category：对应 001 的 MaterialCategory；不属于那四类（保险、行程单…）填 null。
# parts：组合类型——需要由多个子类型的记录共同满足，只允许一层。
# reusable: false：一次性材料（只为某一次办事准备，例如行程单、解释信）。在办事里上传时默认只属于那件办事，
#   不进长期资料库、也不会被别的办事匹配到；不写默认为 true（长期材料，可以跨事项复用）。

# 查词表前依次删除的片段（Python 正则）。改这里会影响所有攻略的匹配，改完跑一遍：uv run python -m core.guides
normalize:
  - '原件'
  - '复印件'
  - '副本'
  - '整本'
  - '中英文'
  - '两寸'
  - '白底'
  - '×\s*\d+\s*份'
  - '(最)?近\s*\d+(\s*-\s*\d+)?\s*个月'
  - '[+＋/、]'

types:
  # ---- 证件 ----
  - key: passport_bio_page
    name: 护照个人信息页
    category: passport_scan
    aliases: [护照个人信息页, 护照首页, 护照资料页, passport bio page]
  # 签证页和出入境盖章页算同一类：申请签证只看有签证、有出入境章的页，大家通常把它们扫在同一份文件里。
  # （2026-09-24 合并：原来的 passport_visa_page「护照签证页」并进来，叫法都保留成别名。）
  - key: passport_stamped_pages
    name: 护照签证页和盖章页
    category: passport_scan
    aliases: [护照签证页, 签证页, visa page, 护照盖章页, 护照盖章页（现护照）, 出入境盖章页, 签证页和盖章页, 美签]
  # 攻略里写"护照全部页复印件"，实际要的是个人信息页 + 有签证 / 出入境章的页，空白页不用复印。
  - key: passport_full_copy
    name: 护照复印件（信息页和签证页）
    category: passport_scan
    aliases: [护照复印件, 护照原件及复印件, 护照所有页复印件, 护照所有面, 护照全部页复印件]
    parts: [passport_bio_page, passport_stamped_pages]
  - key: old_passport_copy
    name: 旧护照复印件
    category: passport_scan
    aliases: [旧护照复印件, 旧护照, 护照盖章页（旧护照）]
  - key: national_id
    name: 身份证
    category: passport_scan
    aliases: [身份证, 身份证复印件, 居民身份证]
  - key: household_register
    name: 户口本
    category: passport_scan
    aliases: [户口本, 户口簿, 户口本复印件]
  - key: id_photo
    name: 证件照
    category: id_photo
    aliases: [证件照, 签证照片, 白底照片]

