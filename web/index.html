<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>材料资料库</title>
<link rel="stylesheet" href="/assets/style.css" />
</head>
<body>
  <a class="workbench-banner" href="/workbench.html">
    <strong>试试新版「办事工作台」→</strong>
    <span>攻略、工作笔记、通用办事集中在一个页面。这个旧页面继续保留，材料维护功能不受影响。</span>
  </a>

  <header>
    <h1>材料资料库</h1>
  </header>

  <section class="tab-panel" data-tab-panel="personal">
    <section class="profile-panel">
      <h2>个人信息 &amp; 出行记录</h2>
      <ul id="travel-history-list"></ul>
      <p id="travel-history-empty" class="empty-hint" hidden>还没有出行记录，出国回来之后在这里补一条。</p>

      <button id="travel-history-toggle" class="add-button" type="button">+ 添加出行记录</button>
      <form id="travel-history-form" class="inline-form" hidden>
        <label>国家（不确定可以先留空，之后再补） <input type="text" name="country" /></label>
        <label>入境日期 <input type="date" name="entry_date" required /></label>
        <label>离境日期（还没回国可以留空） <input type="date" name="exit_date" /></label>
        <label>目的 <input type="text" name="purpose" placeholder="旅游 / 出差 / ……" /></label>
        <div class="form-actions">
          <button type="submit">保存</button>
          <button type="button" data-cancel>取消</button>
        </div>
      </form>
    </section>

    <main id="material-groups-personal" class="material-groups"></main>
  </section>

  <section class="tab-panel" data-tab-panel="task" hidden>
    <div class="application-picker">
      <label for="application-select">签证申请：</label>
      <select id="application-select"></select>
    </div>
    <main id="material-groups-task" class="material-groups"></main>
    <p id="empty-state" hidden>这次申请下还没有材料记录——用下面的表单加一条，或者直接在 <code>materials_index/records/</code> 里加一个 YAML 文件。</p>
  </section>

  <section class="tab-panel" data-tab-panel="career" hidden>
    <p class="empty-hint">周报和简历还没做——这个 tab 先占个位置，内容和怎么存留到下一轮再定。</p>
  </section>

  <!-- 固定在页面底部，像手机 App 的底部标签栏 -->
  <nav class="tab-bar" id="tab-bar">
    <button class="tab-button" type="button" data-tab="personal">个人材料</button>
    <button class="tab-button" type="button" data-tab="task">办事材料准备</button>
    <button class="tab-button" type="button" data-tab="career">工作经历和简历</button>
  </nav>

  <template id="edit-travel-history-template">
    <form class="inline-form" data-edit-form>
      <label>国家 <input type="text" name="country" /></label>
      <label>入境日期 <input type="date" name="entry_date" required /></label>
      <label>离境日期（还没回国可以留空） <input type="date" name="exit_date" /></label>
      <label>目的 <input type="text" name="purpose" placeholder="旅游 / 出差 / ……" /></label>
      <div class="form-actions">
        <button type="submit">保存</button>
        <button type="button" data-cancel>取消</button>
      </div>
    </form>
  </template>

  <template id="add-material-template">
    <button class="add-button" type="button" data-add-material>+ 添加这一类材料</button>
    <form class="inline-form" data-material-form hidden>
      <label>材料名称 <input type="text" name="type" required placeholder="例如：护照签证页" /></label>
      <label>备注 <input type="text" name="sublabel" placeholder="选填" /></label>
      <label>获得日期 <input type="date" name="obtained_date" required /></label>
      <label>文件（选填，比如手机拍的扫描件） <input type="file" name="file" /></label>
      <div class="form-actions">
        <button type="submit">保存</button>
        <button type="button" data-cancel>取消</button>
      </div>
    </form>
  </template>

  <script src="/assets/app.js"></script>
</body>
</html>
